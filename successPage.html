<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <link
        rel="icon"
        href="images/dollar.png"
        type="image/png"
        sizes="16x16"
    >

    <title>Payment Success</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@500&display=swap"
        rel="stylesheet"
    >


    <style>

        body {
            background: #dcf0fa;
        }


        .container {
            max-width: 380px;
            margin: 50px auto;
            overflow: hidden;
        }


        /* ========================================
           PRINTER
           ======================================== */

        .printer-top {
            z-index: 1;
            border: 6px solid #666666;
            height: 6px;
            border-bottom: 0;
            border-radius: 6px 6px 0 0;
            background: #333333;
        }


        .printer-bottom {
            z-index: 0;
            border: 6px solid #666666;
            height: 6px;
            border-top: 0;
            border-radius: 0 0 6px 6px;
            background: #333333;
        }


        /* ========================================
           PAPER
           ======================================== */

        .paper-container {
            position: relative;
            overflow: hidden;
            height: 467px;
        }


        .paper {
            background: #ffffff;
            font-family: 'Poppins', sans-serif;
            height: 447px;
            position: absolute;
            z-index: 2;

            margin: 0 12px;
            margin-top: -12px;

            animation:
                print 5000ms
                cubic-bezier(
                    0.68,
                    -0.55,
                    0.265,
                    0.9
                );
        }


        .main-contents {
            margin: 0 12px;
            padding: 24px;
        }


        /* ========================================
           PAPER JAGGED EDGE
           ======================================== */

        .jagged-edge {
            position: relative;
            height: 20px;
            width: 100%;
            margin-top: -1px;
        }


        .jagged-edge:after {

            content: "";

            display: block;

            position: absolute;

            left: 0;
            right: 0;

            height: 20px;

            background:

                linear-gradient(
                    45deg,
                    transparent 33.333%,
                    #ffffff 33.333%,
                    #ffffff 66.667%,
                    transparent 66.667%
                ),

                linear-gradient(
                    -45deg,
                    transparent 33.333%,
                    #ffffff 33.333%,
                    #ffffff 66.667%,
                    transparent 66.667%
                );

            background-size:
                16px 40px;

            background-position:
                0 -20px;

        }


        /* ========================================
           SAME GREEN SUCCESS ICON
           ======================================== */

        .success-icon {

            text-align: center;

            font-size: 48px;

            line-height: 72px;

            background: #359d00;

            border-radius: 50%;

            width: 72px;
            height: 72px;

            margin: 16px auto;

            color: #ffffff;

        }


        /* ========================================
           SUCCESS TITLE
           ======================================== */

        .success-title {

            font-size: 22px;

            font-family:
                'Poppins',
                sans-serif;

            text-align: center;

            color: #666;

            font-weight: bold;

            margin-bottom: 10px;

        }


        /* ========================================
           CHINESE + MALAY
           ======================================== */

        .success-translations {

            text-align: center;

            font-family:
                'Poppins',
                sans-serif;

            color: #888;

            margin-bottom: 16px;

        }


        .success-chinese {

            font-size: 18px;

            margin-bottom: 4px;

        }


        .success-malay {

            font-size: 15px;

        }


        /* ========================================
           DESCRIPTION
           ======================================== */

        .success-description {

            font-size: 14px;

            font-family:
                'Poppins',
                sans-serif;

            line-height: 21px;

            color: #999;

            text-align: center;

            margin-bottom: 20px;

        }


        /* ========================================
           TRANSACTION DETAILS
           ======================================== */

        .order-details {

            text-align: center;

            color: #333;

            font-weight: bold;

        }


        .order-number-label {

            font-size: 18px;

            margin-bottom: 8px;

        }


        .order-number {

            border-top:
                1px solid #ccc;

            border-bottom:
                1px solid #ccc;

            line-height: 48px;

            font-size: 36px;

            padding: 8px 0;

            margin-bottom: 18px;

        }


        .complement {

            font-size: 18px;

            margin-bottom: 5px;

            color: #32a852;

        }


        .complement-chinese {

            font-size: 15px;

            color: #32a852;

            margin-bottom: 3px;

        }


        .complement-malay {

            font-size: 14px;

            color: #32a852;

        }


        /* ========================================
           RETURN MESSAGE
           ======================================== */

        .return-message {

            text-align: center;

            margin-top: 12px;

            font-size: 11px;

            color: #bbb;

        }


        /* ========================================
           PRINT ANIMATION
           ======================================== */

        @keyframes print {

            0% {
                transform:
                    translateY(-90%);
            }

            100% {
                transform:
                    translateY(0%);
            }

        }


        @-webkit-keyframes print {

            0% {
                -webkit-transform:
                    translateY(-90%);
            }

            100% {
                -webkit-transform:
                    translateY(0%);
            }

        }


        @-moz-keyframes print {

            0% {
                -moz-transform:
                    translateY(-90%);
            }

            100% {
                -moz-transform:
                    translateY(0%);
            }

        }


        @-ms-keyframes print {

            0% {
                -ms-transform:
                    translateY(-90%);
            }

            100% {
                -ms-transform:
                    translateY(0%);
            }

        }

    </style>

</head>



<body>


    <div class="container">


        <!-- PRINTER TOP -->

        <div class="printer-top"></div>



        <div class="paper-container">


            <!-- PRINTER BOTTOM -->

            <div class="printer-bottom"></div>



            <!-- RECEIPT -->

            <div class="paper">


                <div class="main-contents">


                    <!-- SAME SUCCESS ICON -->

                    <div class="success-icon">

                        &#10004;

                    </div>



                    <!-- ENGLISH -->

                    <div class="success-title">

                        Payment Complete

                    </div>



                    <!-- CHINESE + MALAY -->

                    <div class="success-translations">


                        <div class="success-chinese">

                            付款成功

                        </div>


                        <div class="success-malay">

                            Pembayaran Berjaya

                        </div>


                    </div>



                    <!-- DESCRIPTION -->

                    <div class="success-description">

                        Thank you for completing the payment!

                        <br>

                        谢谢您完成付款！

                        <br>

                        Terima kasih kerana melengkapkan pembayaran!

                    </div>



                    <!-- TRANSACTION -->

                    <div class="order-details">


                        <div class="order-number-label">

                            Transaction ID

                        </div>


                        <div
                            class="order-number"
                            id="transactionID"
                        >

                            123456789

                        </div>



                        <div class="complement">

                            Thank You!

                        </div>


                        <div class="complement-chinese">

                            谢谢！

                        </div>


                        <div class="complement-malay">

                            Terima Kasih!

                        </div>


                    </div>



                    <div class="return-message">

                        Returning to card reader...

                    </div>


                </div>



                <!-- JAGGED RECEIPT EDGE -->

                <div class="jagged-edge"></div>


            </div>


        </div>


    </div>



    <!-- ==========================================
         VOICE.JS
         ========================================== -->

    <script src="js/voice.js"></script>



    <script>


        // ==========================================
        // PREVENT DOUBLE REDIRECT
        // ==========================================

        let returningHome = false;



        // ==========================================
        // RETURN TO NFC PAGE
        // ==========================================

        function returnToHome() {


            if (returningHome) {

                return;

            }


            returningHome = true;


            window.location.href =
                "index.html";


        }



        // ==========================================
        // SUCCESS PAGE LOAD
        // ==========================================

        window.addEventListener(
            "load",
            function () {


                // Wait for receipt animation
                // to start before speaking

                setTimeout(
                    function () {


                        if (
                            typeof voicePaymentSuccessful ===
                            "function"
                        ) {


                            voicePaymentSuccessful(
                                function () {


                                    // Wait 2 seconds after
                                    // English → Chinese → Malay
                                    // have finished

                                    setTimeout(
                                        function () {


                                            returnToHome();


                                        },
                                        2000
                                    );


                                }
                            );


                        }


                    },
                    1000
                );


            }
        );



        // ==========================================
        // FALLBACK RETURN
        // ==========================================
        //
        // If the browser doesn't fire the
        // speech completion event, it will
        // still return to index.html.
        // ==========================================

        setTimeout(
            function () {


                returnToHome();


            },
            12000
        );


    </script>


</body>

</html>

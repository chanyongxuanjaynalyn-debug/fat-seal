<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>NFC Payment</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, sans-serif;

            background: #ffffff;
            color: #3f3f3f;
        }


        .container {
            width: 90%;
            max-width: 650px;

            padding: 60px 40px;

            text-align: center;

            border: 1px solid #e0e5e9;
            border-radius: 12px;

            background: white;

            box-shadow:
                0 5px 20px rgba(0, 0, 0, 0.06);
        }


        h1 {
            margin-top: 0;
            margin-bottom: 20px;

            font-size: 42px;
            font-weight: 400;

            color: #6eadd9;
        }


        .nfc-icon {
            font-size: 70px;
            margin-bottom: 20px;
        }


        .instruction {
            margin-bottom: 15px;

            font-size: 22px;
            font-weight: bold;

            color: #31bd67;
        }


        .description {
            margin-bottom: 30px;

            font-size: 17px;

            color: #888;
        }


        #status {
            margin-top: 25px;
            margin-bottom: 25px;

            padding: 15px;

            border-radius: 7px;

            background: #f5f7f9;

            font-size: 18px;
            font-weight: bold;

            color: #777;
        }


        #status.success {
            background: #edf9f1;
            color: #31bd67;
        }


        #status.error {
            background: #fff0f0;
            color: #d9534f;
        }


        button {
            padding: 14px 28px;

            border: none;
            border-radius: 7px;

            background: #6eadd9;

            color: white;

            font-size: 17px;
            font-weight: bold;

            cursor: pointer;
        }


        button:hover {
            opacity: 0.9;
        }


        .test-text {
            margin-top: 12px;

            font-size: 13px;

            color: #aaa;
        }


        @media (max-width: 600px) {

            .container {
                padding: 40px 20px;
            }


            h1 {
                font-size: 34px;
            }


            .instruction {
                font-size: 19px;
            }

        }

    </style>

</head>


<body>


    <div class="container">


        <div class="nfc-icon">
            💳
        </div>


        <h1>
            NFC Payment
        </h1>


        <div class="instruction">
            Tap your NFC card
        </div>


        <div class="description">
            Please tap your card on the NFC reader
            to continue to payment.
        </div>


        <div id="status">
            Waiting for card...
        </div>


        <!--
            TEMPORARY TEST BUTTON

            You can remove this button later
            when your NFC terminal is available.
        -->

        <button
            type="button"
            id="testButton"
        >
            TEST CARD
        </button>


        <div class="test-text">
            Test mode — simulates NFC card 0064446838
        </div>


    </div>



    <script>


        // ==========================================
        // AUTHORISED NFC CARD
        // ==========================================

        const authorisedCard =
            "0064446838";


        // ==========================================
        // NFC INPUT STORAGE
        // ==========================================

        let nfcInput = "";



        // ==========================================
        // OPEN PAYMENT PAGE
        // ==========================================

        function openPaymentPage(cardNumber) {


            const status =
                document.getElementById(
                    "status"
                );


            status.textContent =
                "Card recognised! Opening payment page...";


            status.classList.remove(
                "error"
            );


            status.classList.add(
                "success"
            );


            console.log(
                "Card recognised:",
                cardNumber
            );


            // Small delay so user can see
            // the success message

            setTimeout(
                function() {


                    window.location.href =
                        "paymentPage.html?card=" +
                        encodeURIComponent(
                            cardNumber
                        );


                },
                600
            );


        }



        // ==========================================
        // INVALID CARD
        // ==========================================

        function invalidCard() {


            const status =
                document.getElementById(
                    "status"
                );


            status.textContent =
                "Card not recognised.";


            status.classList.remove(
                "success"
            );


            status.classList.add(
                "error"
            );


        }



        // ==========================================
        // NFC READER
        //
        // Most USB NFC readers behave like
        // keyboards and type the card number.
        // ==========================================

        document.addEventListener(
            "keydown",
            function(event) {


                // ----------------------------------
                // COLLECT NUMBERS
                // ----------------------------------

                if (
                    /^[0-9]$/.test(
                        event.key
                    )
                ) {


                    nfcInput +=
                        event.key;


                    console.log(
                        "Reading NFC:",
                        nfcInput
                    );


                    document.getElementById(
                        "status"
                    ).textContent =
                        "Reading card...";


                    // ----------------------------------
                    // CARD NUMBER COMPLETE
                    // ----------------------------------

                    if (
                        nfcInput ===
                        authorisedCard
                    ) {


                        openPaymentPage(
                            nfcInput
                        );


                        nfcInput = "";


                        return;


                    }



                    // ----------------------------------
                    // TOO MANY NUMBERS
                    // ----------------------------------

                    if (
                        nfcInput.length >=
                        authorisedCard.length
                    ) {


                        invalidCard();


                        nfcInput = "";


                    }


                }



                // ----------------------------------
                // SOME NFC READERS SEND ENTER
                // ----------------------------------

                if (
                    event.key ===
                    "Enter"
                ) {


                    event.preventDefault();


                    if (
                        nfcInput ===
                        authorisedCard
                    ) {


                        openPaymentPage(
                            nfcInput
                        );


                    }

                    else if (
                        nfcInput !== ""
                    ) {


                        invalidCard();


                    }


                    nfcInput = "";


                }


            }
        );



        // ==========================================
        // TEST BUTTON
        //
        // Simulates tapping card:
        // 0064446838
        // ==========================================

        document.getElementById(
            "testButton"
        ).addEventListener(
            "click",
            function() {


                openPaymentPage(
                    authorisedCard
                );


            }
        );


    </script>


</body>

</html>

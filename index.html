<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NFC Payment</title>
</head>

<body>

    <h2>Tap your NFC card</h2>
    <p>Please tap your card on the NFC reader.</p>

    <script>

        // ==============================
        // NFC INPUT
        // ==============================

        let nfcInput = "";


        // ==============================
        // CARD DATABASE
        //
        // ORDER OF VALUES:
        // 1. Card Number
        // 2. Amount
        // 3. Name on Card
        // 4. Expiry Month
        // 5. Expiry Year
        // 6. CVV
        // ==============================

        const cards = {

            "0064446838": {
                cardNumber: "0064446838",
                amount: "300",
                name: "Amanda Boh",
                expiryMonth: "08",
                expiryYear: "26",
                cvv: "123"
            }

        };


        // ==============================
        // LISTEN FOR NFC READER
        // ==============================

        document.addEventListener("keydown", function (event) {


            // Ignore modifier keys
            if (
                event.key === "Shift" ||
                event.key === "Control" ||
                event.key === "Alt" ||
                event.key === "Tab"
            ) {
                return;
            }


            // ==============================
            // NFC READER PRESSES ENTER
            // ==============================

            if (event.key === "Enter") {

                const cardNumber = nfcInput.trim();

                console.log("NFC Card Number:", cardNumber);


                // ==============================
                // CHECK CARD
                // ==============================

                if (cards[cardNumber]) {

                    const card = cards[cardNumber];

                    console.log("Card accepted");
                    console.log("Amount:", card.amount);
                    console.log("Name:", card.name);


                    // ==============================
                    // SEND CARD INFORMATION
                    // TO PAYMENT PAGE
                    // ==============================

                    const params = new URLSearchParams();

                    // ORDER:
                    // Card Number
                    params.append(
                        "cardNumber",
                        card.cardNumber
                    );

                    // Amount
                    params.append(
                        "amount",
                        card.amount
                    );

                    // Name
                    params.append(
                        "name",
                        card.name
                    );

                    // Expiry Month
                    params.append(
                        "expiryMonth",
                        card.expiryMonth
                    );

                    // Expiry Year
                    params.append(
                        "expiryYear",
                        card.expiryYear
                    );

                    // CVV
                    params.append(
                        "cvv",
                        card.cvv
                    );


                    // ==============================
                    // OPEN PAYMENT PAGE
                    // ==============================

                    window.location.href =
                        "paymentPage.html?" +
                        params.toString();

                }

                else {

                    console.log("Unknown card");

                    alert("Card not recognised.");

                }


                // Reset NFC input
                nfcInput = "";

                return;

            }


            // ==============================
            // COLLECT NFC CARD NUMBER
            // ==============================

            if (/^[0-9]$/.test(event.key)) {

                nfcInput += event.key;

            }

        });

    </script>

</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>NFC Payment</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, sans-serif;

            background: #ffffff;
            color: #3f3f3f;
        }

        .container {
            width: 90%;
            max-width: 650px;

            padding: 60px 40px;

            text-align: center;

            border: 1px solid #e0e5e9;
            border-radius: 12px;

            background: white;

            box-shadow:
                0 5px 20px rgba(0, 0, 0, 0.06);
        }

        .card-icon {
            font-size: 75px;
            margin-bottom: 20px;
        }

        h1 {
            margin-top: 0;
            margin-bottom: 20px;

            font-size: 42px;
            font-weight: 400;

            color: #6eadd9;
        }

        .instruction {
            margin-bottom: 12px;

            font-size: 23px;
            font-weight: bold;

            color: #31bd67;
        }

        .instruction-cn {
            margin-bottom: 8px;

            font-size: 21px;

            color: #555;
        }

        .instruction-ms {
            margin-bottom: 30px;

            font-size: 18px;

            color: #777;
        }

        #status {
            margin-top: 25px;
            margin-bottom: 25px;

            padding: 16px;

            border-radius: 8px;

            background: #f5f7f9;

            font-size: 18px;
            font-weight: bold;

            color: #777;
        }

        #status.success {
            background: #edf9f1;
            color: #31bd67;
        }

        #status.error {
            background: #fff0f0;
            color: #d9534f;
        }

        button {
            padding: 14px 28px;

            border: none;
            border-radius: 7px;

            background: #6eadd9;

            color: white;

            font-size: 17px;
            font-weight: bold;

            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        .test-note {
            margin-top: 12px;

            font-size: 13px;

            color: #aaa;
        }

        @media (max-width: 600px) {

            .container {
                padding: 40px 20px;
            }

            h1 {
                font-size: 34px;
            }

            .instruction {
                font-size: 20px;
            }

        }

    </style>

</head>


<body>


    <div class="container">


        <div class="card-icon">
            💳
        </div>


        <h1>
            NFC Payment
        </h1>


        <div class="instruction">
            Please tap your card
        </div>


        <div class="instruction-cn">
            请轻触您的卡
        </div>



        <div id="status">
            Waiting for card...
        </div>


        <!--
            TEMPORARY TEST BUTTON

            Remove this button when
            your NFC terminal is available.
        -->

        <button
            type="button"
            id="testButton"
        >
            TEST CARD
        </button>


        <div class="test-note">
            Test mode: simulates card 0064446838
        </div>


    </div>



    <!-- ==========================================
         VOICE FUNCTIONS
         ========================================== -->

    <script src="js/voice.js"></script>



    <script>

        // ==========================================
        // AUTHORISED CARD
        // ==========================================

        const authorisedCard =
            "0064446838";


        // ==========================================
        // NFC INPUT STORAGE
        // ==========================================

        let nfcInput = "";


        let cardProcessing = false;



        // ==========================================
        // INITIAL VOICE PROMPT
        // ==========================================
        //
        // Browsers may block automatic speech
        // until the user first interacts with
        // the webpage.
        //
        // Once interaction is available,
        // this announces:
        //
        // English
        // Chinese
        // Malay
        // ==========================================

        window.addEventListener(
            "load",
            function () {

                setTimeout(
                    function () {

                        if (
                            typeof voiceTapCard ===
                            "function"
                        ) {

                            voiceTapCard();

                        }

                    },
                    800
                );

            }
        );



        // ==========================================
        // OPEN PAYMENT PAGE
        // ==========================================

       function openPaymentPage(cardNumber) {

    if (cardProcessing) {
        return;
    }

    cardProcessing = true;

    const status =
        document.getElementById("status");

    status.textContent =
        "Card recognised";

    status.classList.remove("error");
    status.classList.add("success");

    console.log(
        "Card recognised:",
        cardNumber
    );


    // Prevent redirect from happening twice
    let redirected = false;


    function redirectOnce() {

        if (redirected) {
            return;
        }

        redirected = true;

        goToPaymentPage(cardNumber);
    }


    // Speak card accepted
    if (
        typeof voiceCardAccepted ===
        "function"
    ) {

        voiceCardAccepted(
            function () {

                // Redirect when speech finishes
                redirectOnce();

            }
        );

    }


    // FALLBACK:
    // Redirect even if speech completion
    // is not detected by the browser
    setTimeout(
        function () {

            redirectOnce();

        },
        4500
    );

}

        // ==========================================
        // NFC READER
        // ==========================================
        //
        // USB NFC readers normally behave
        // like keyboards.
        //
        // They enter digits rapidly and may
        // press Enter afterwards.
        // ==========================================

        document.addEventListener(
            "keydown",
            function (event) {


                if (cardProcessing) {
                    return;
                }


                // ==================================
                // READ NUMBERS
                // ==================================

                if (
                    /^[0-9]$/.test(
                        event.key
                    )
                ) {


                    nfcInput +=
                        event.key;


                    document.getElementById(
                        "status"
                    ).textContent =
                        "Reading card...";


                    console.log(
                        "NFC input:",
                        nfcInput
                    );


                    // ==================================
                    // CORRECT CARD
                    // ==================================

                    if (
                        nfcInput ===
                        authorisedCard
                    ) {


                        const detectedCard =
                            nfcInput;


                        nfcInput = "";


                        openPaymentPage(
                            detectedCard
                        );


                        return;

                    }


                    // ==================================
                    // WRONG CARD / TOO MANY DIGITS
                    // ==================================

                    if (
                        nfcInput.length >=
                        authorisedCard.length
                    ) {


                        nfcInput = "";


                        invalidCard();


                        return;

                    }

                }



                // ==================================
                // NFC READER ENTER KEY
                // ==================================

                if (
                    event.key === "Enter"
                ) {


                    event.preventDefault();


                    if (
                        nfcInput ===
                        authorisedCard
                    ) {


                        const detectedCard =
                            nfcInput;


                        nfcInput = "";


                        openPaymentPage(
                            detectedCard
                        );


                    }

                    else if (
                        nfcInput !== ""
                    ) {


                        nfcInput = "";


                        invalidCard();


                    }

                }

            }
        );



        // ==========================================
        // TEST CARD BUTTON
        // ==========================================
        //
        // Lets you test everything without
        // your NFC terminal.
        // ==========================================

        document.getElementById(
            "testButton"
        ).addEventListener(
            "click",
            function () {


                openPaymentPage(
                    authorisedCard
                );


            }
        );


    </script>


</body>

</html>

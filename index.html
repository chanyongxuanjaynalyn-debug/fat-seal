<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>NFC Payment</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, sans-serif;

            background: #ffffff;
            color: #3f3f3f;
        }

        .container {
            width: 90%;
            max-width: 650px;

            padding: 60px 40px;

            text-align: center;

            border: 1px solid #e0e5e9;
            border-radius: 12px;

            background: white;

            box-shadow:
                0 5px 20px rgba(0, 0, 0, 0.06);
        }

        .card-icon {
            font-size: 75px;
            margin-bottom: 20px;
        }

        h1 {
            margin-top: 0;
            margin-bottom: 20px;

            font-size: 42px;
            font-weight: 400;

            color: #6eadd9;
        }

        .instruction {
            margin-bottom: 12px;

            font-size: 23px;
            font-weight: bold;

            color: #31bd67;
        }

        .instruction-cn {
            margin-bottom: 8px;

            font-size: 21px;

            color: #555;
        }

        .instruction-ms {
            margin-bottom: 30px;

            font-size: 18px;

            color: #777;
        }

        #status {
            margin-top: 25px;
            margin-bottom: 25px;

            padding: 16px;

            border-radius: 8px;

            background: #f5f7f9;

            font-size: 18px;
            font-weight: bold;

            color: #777;
        }

        #status.success {
            background: #edf9f1;
            color: #31bd67;
        }

        #status.error {
            background: #fff0f0;
            color: #d9534f;
        }

        button {
            padding: 14px 28px;

            border: none;
            border-radius: 7px;

            background: #6eadd9;

            color: white;

            font-size: 17px;
            font-weight: bold;

            cursor: pointer;

            margin: 5px;
        }

        button:hover {
            opacity: 0.9;
        }

        .test-note {
            margin-top: 12px;

            font-size: 13px;

            color: #aaa;
        }

        @media (max-width: 600px) {

            .container {
                padding: 40px 20px;
            }

            h1 {
                font-size: 34px;
            }

            .instruction {
                font-size: 20px;
            }

        }

    </style>

</head>


<body>


    <div class="container">


        <div class="card-icon">
            💳
        </div>


        <h1>
            NFC Payment
        </h1>


        <div class="instruction">
            Please tap your card
        </div>


        <div class="instruction-cn">
            请轻触您的卡
        </div>


        <div id="status">
            Waiting for card...
        </div>


        <!-- TEST BUTTONS -->

        <button
            type="button"
            id="testCard1"
        >
            TEST CARD 1
        </button>


        <button
            type="button"
            id="testCard2"
        >
            TEST FAT SEAL
        </button>


        <div class="test-note">
            Test mode only
        </div>


    </div>



    <!-- ==========================================
         VOICE FUNCTIONS
         ========================================== -->

    <script src="js/voice.js"></script>



    <script>


        // ==========================================
        // CARD DATABASE
        // ==========================================
        //
        // CARD 1
        // 0064559458
        //
        // FAT SEAL
        // 0064446838
        // Balance: $6700
        // Expiry: 11/28
        // CVV: 520
        //
        // ==========================================


        const cardData = {


            "0064559458": {

                name: "Card 1",

                balance: 0,

                expiry: "",

                cvv: ""

            },


            "0064446838": {

                name: "Fat Seal",

                balance: 6700,

                expiry: "11/28",

                cvv: "520"

            }


        };



        // ==========================================
        // AUTHORISED CARDS
        // ==========================================

        const authorisedCards =
            Object.keys(cardData);



        // ==========================================
        // NFC VARIABLES
        // ==========================================

        let nfcInput = "";

        let cardProcessing = false;

        let inputTimer = null;



        // ==========================================
        // INITIAL VOICE PROMPT
        // ==========================================

        window.addEventListener(
            "load",
            function () {

                setTimeout(
                    function () {

                        if (
                            typeof voiceTapCard ===
                            "function"
                        ) {

                            voiceTapCard();

                        }

                    },
                    800
                );

            }
        );



        // ==========================================
        // RESET STATUS
        // ==========================================

        function resetStatus() {

            const status =
                document.getElementById(
                    "status"
                );

            status.textContent =
                "Waiting for card...";

            status.classList.remove(
                "success"
            );

            status.classList.remove(
                "error"
            );

        }



        // ==========================================
        // INVALID CARD
        // ==========================================

        function invalidCard() {

            const status =
                document.getElementById(
                    "status"
                );


            status.textContent =
                "Card not recognised";


            status.classList.remove(
                "success"
            );


            status.classList.add(
                "error"
            );


            console.log(
                "CARD NOT RECOGNISED"
            );


            if (
                typeof voiceInvalidCard ===
                "function"
            ) {

                voiceInvalidCard();

            }


            setTimeout(
                function () {

                    resetStatus();

                },
                2500
            );

        }



        // ==========================================
        // PROCESS COMPLETE CARD
        // ==========================================

        function processCard() {


            clearTimeout(
                inputTimer
            );


            const cardNumber =
                nfcInput.trim();


            console.log(
                "FULL NFC CARD NUMBER:",
                cardNumber
            );


            // Clear input ready for next scan

            nfcInput = "";


            if (
                cardNumber === ""
            ) {

                return;

            }



            // ======================================
            // CHECK AUTHORISED CARDS
            // ======================================

            if (
                authorisedCards.includes(
                    cardNumber
                )
            ) {


                console.log(
                    "AUTHORISED CARD:",
                    cardNumber
                );


                openPaymentPage(
                    cardNumber
                );


                return;

            }



            // ======================================
            // UNKNOWN CARD
            // ======================================

            console.log(
                "UNKNOWN CARD:",
                cardNumber
            );


            invalidCard();

        }



        // ==========================================
        // OPEN PAYMENT PAGE
        // ==========================================

        function openPaymentPage(
            cardNumber
        ) {


            if (
                cardProcessing
            ) {

                return;

            }


            const card =
                cardData[
                    cardNumber
                ];


            if (
                !card
            ) {

                invalidCard();

                return;

            }


            cardProcessing =
                true;


            const status =
                document.getElementById(
                    "status"
                );


            status.textContent =
                card.name +
                " recognised";


            status.classList.remove(
                "error"
            );


            status.classList.add(
                "success"
            );


            console.log(
                "Card recognised:",
                cardNumber
            );


            console.log(
                "Card name:",
                card.name
            );


            console.log(
                "Balance:",
                card.balance
            );



            // ======================================
            // SPEAK CARD ACCEPTED
            // ======================================

            if (
                typeof voiceCardAccepted ===
                "function"
            ) {

                voiceCardAccepted();

            }



            // ======================================
            // REDIRECT AFTER 3 SECONDS
            // ======================================

            setTimeout(
                function () {

                    goToPaymentPage(
                        cardNumber
                    );

                },
                3000
            );

        }



        // ==========================================
        // GO TO PAYMENT PAGE
        // ==========================================

        function goToPaymentPage(
            cardNumber
        ) {


            console.log(
                "Redirecting card:",
                cardNumber
            );


            window.location.href =
                "paymentPage.html?card=" +
                encodeURIComponent(
                    cardNumber
                );

        }



        // ==========================================
        // NFC READER
        // ==========================================
        //
        // The NFC reader behaves like a keyboard.
        //
        // It sends the card number one character
        // at a time.
        //
        // We wait 150 ms after the final character
        // before processing the complete card.
        //
        // If the NFC reader sends ENTER, the card
        // is processed immediately.
        //
        // ==========================================


        document.addEventListener(
            "keydown",
            function (event) {


                if (
                    cardProcessing
                ) {

                    return;

                }



                // ==================================
                // NUMBER RECEIVED
                // ==================================

                if (
                    /^[0-9]$/.test(
                        event.key
                    )
                ) {


                    nfcInput +=
                        event.key;


                    console.log(
                        "Reading NFC:",
                        nfcInput
                    );


                    const status =
                        document.getElementById(
                            "status"
                        );


                    status.textContent =
                        "Reading card...";


                    status.classList.remove(
                        "error"
                    );


                    status.classList.remove(
                        "success"
                    );



                    // Cancel previous timer

                    clearTimeout(
                        inputTimer
                    );



                    // Wait for reader to finish

                    inputTimer =
                        setTimeout(
                            function () {

                                processCard();

                            },
                            150
                        );


                    return;

                }



                // ==================================
                // ENTER FROM NFC READER
                // ==================================

                if (
                    event.key ===
                    "Enter"
                ) {


                    event.preventDefault();


                    clearTimeout(
                        inputTimer
                    );


                    processCard();


                    return;

                }

            }
        );



        // ==========================================
        // TEST CARD 1
        // ==========================================

        document.getElementById(
            "testCard1"
        ).addEventListener(
            "click",
            function () {


                openPaymentPage(
                    "0064559458"
                );


            }
        );



        // ==========================================
        // TEST FAT SEAL
        // ==========================================

        document.getElementById(
            "testCard2"
        ).addEventListener(
            "click",
            function () {


                openPaymentPage(
                    "0064446838"
                );


            }
        );



        // ==========================================
        // ENABLE VOICE AFTER FIRST INTERACTION
        // ==========================================

        let firstInteractionDone =
            false;


        document.addEventListener(
            "click",
            function () {


                if (
                    firstInteractionDone
                ) {

                    return;

                }


                firstInteractionDone =
                    true;


                if (
                    typeof voiceTapCard ===
                    "function"
                ) {

                    voiceTapCard();

                }

            }
        );


    </script>


</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>NFC Payment</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 40px 20px;
            font-family: Arial, sans-serif;
            background: #ffffff;
            color: #3f3f3f;
        }

        .payment-container {
            width: 100%;
            max-width: 780px;
            margin: 0 auto;
            border: 1px solid #e0e5e9;
            padding: 50px 60px;
        }

        h1 {
            margin-top: 0;
            margin-bottom: 35px;
            text-align: center;
            font-size: 38px;
            font-weight: 400;
            color: #6eadd9;
        }

        .tap-message {
            text-align: center;
            margin-bottom: 35px;
            color: #888;
        }

        .tap-message strong {
            color: #31bd67;
        }

        .form-group {
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 14px;
            font-size: 20px;
            font-weight: bold;
        }

        input {
            width: 100%;
            height: 50px;
            padding: 0 13px;
            border: 1px solid #dfe4e8;
            border-radius: 7px;
            outline: none;
            font-size: 19px;
            color: #555;
            background: white;
        }

        input:focus {
            border-color: #6eadd9;
        }

        input::placeholder {
            color: #c5c8cb;
        }

        .expiry-row {
            display: flex;
            gap: 45px;
            align-items: flex-start;
        }

        .expiry-section {
            flex: 1;
        }

        .cvv-section {
            flex: 1;
        }

        .expiry-inputs {
            display: flex;
            gap: 18px;
        }

        .expiry-inputs input {
            width: 90px;
        }

        button {
            margin-top: 5px;
            padding: 13px 20px;
            border: none;
            border-radius: 7px;
            background: #6eadd9;
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        #status {
            margin-top: 20px;
            font-weight: bold;
        }

    </style>
</head>


<body>

    <div class="payment-container">

        <h1>Credit Card Info</h1>

        <div class="tap-message">
            <strong>Tap your NFC card</strong><br>
            Your card information will appear automatically.
        </div>


        <!-- AMOUNT -->
        <div class="form-group">

            <label for="amount">
                AMOUNT
            </label>

            <input
                type="text"
                id="amount"
                placeholder="$0.00"
                readonly
            >

        </div>


        <!-- NAME -->
        <div class="form-group">

            <label for="nameOnCard">
                NAME ON CARD
            </label>

            <input
                type="text"
                id="nameOnCard"
                placeholder="Enter the name"
                readonly
            >

        </div>


        <!-- CARD NUMBER -->
        <div class="form-group">

            <label for="cardNumber">
                CARD NUMBER
            </label>

            <input
                type="text"
                id="cardNumber"
                placeholder="0000-0000-0000-0000"
                readonly
            >

        </div>


        <!-- EXPIRATION + CVV -->
        <div class="form-group expiry-row">

            <div class="expiry-section">

                <label>
                    EXPIRATION
                </label>

                <div class="expiry-inputs">

                    <input
                        type="text"
                        id="expiryMonth"
                        placeholder="MM"
                        readonly
                    >

                    <input
                        type="text"
                        id="expiryYear"
                        placeholder="YY"
                        readonly
                    >

                </div>

            </div>


            <div class="cvv-section">

                <label for="cvv">
                    CVV NUMBER
                </label>

                <input
                    type="password"
                    id="cvv"
                    placeholder="•••"
                    readonly
                >

            </div>

        </div>


        <button
            type="button"
            id="sendButton"
        >
            SEND
        </button>

        <div id="status"></div>

    </div>


    <script>

        // ==========================================
        // NFC CARD INPUT
        // ==========================================

        let nfcInput = "";


        // ==========================================
        // DEMO CARD DATABASE
        //
        // Order:
        // 1. Card number
        // 2. Amount
        // 3. Name
        // 4. Expiry month
        // 5. Expiry year
        // 6. CVV
        // ==========================================

        const cards = {

            "0064446838": {

                cardNumber: "0064446838",

                amount: "300",

                name: "Amanda Boh",

                expiryMonth: "08",

                expiryYear: "26",

                cvv: "123"

            }

        };


        // ==========================================
        // FILL CARD INFORMATION
        // ==========================================

        function fillCard(card) {

            document.getElementById("cardNumber").value =
                card.cardNumber;

            document.getElementById("amount").value =
                "$" + card.amount + ".00";

            document.getElementById("nameOnCard").value =
                card.name;

            document.getElementById("expiryMonth").value =
                card.expiryMonth;

            document.getElementById("expiryYear").value =
                card.expiryYear;

            document.getElementById("cvv").value =
                card.cvv;


            document.getElementById("status").textContent =
                "Card recognised.";

        }


        // ==========================================
        // NFC READER
        // ==========================================

        document.addEventListener(
            "keydown",
            function(event) {

                // Ignore modifier keys
                if (
                    event.key === "Shift" ||
                    event.key === "Control" ||
                    event.key === "Alt" ||
                    event.key === "Tab"
                ) {
                    return;
                }


                // NFC reader normally presses Enter
                // after entering the card number
                if (event.key === "Enter") {

                    event.preventDefault();

                    const cardNumber =
                        nfcInput.trim();


                    console.log(
                        "NFC Card:",
                        cardNumber
                    );


                    // Check if card exists
                    if (cards[cardNumber]) {

                        fillCard(
                            cards[cardNumber]
                        );

                    }

                    else {

                        document.getElementById(
                            "status"
                        ).textContent =
                            "Card not recognised.";

                        alert(
                            "Card not recognised."
                        );

                    }


                    // Reset NFC reader input
                    nfcInput = "";

                    return;

                }


                // ==================================
                // COLLECT NFC CARD NUMBER
                // ==================================

                if (/^[0-9]$/.test(event.key)) {

                    nfcInput += event.key;

                }

            }
        );


        // ==========================================
        // SEND BUTTON
        // ==========================================

        document.getElementById(
            "sendButton"
        ).addEventListener(
            "click",
            function() {

                const cardNumber =
                    document.getElementById(
                        "cardNumber"
                    ).value;


                if (!cardNumber) {

                    alert(
                        "Please tap your NFC card first."
                    );

                    return;

                }


                alert(
                    "Payment information submitted."
                );

            }
        );

    </script>

</body>

</html>
